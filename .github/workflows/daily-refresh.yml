name: daily-refresh
on:
  schedule:
    - cron: '0 6 * * *' # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  update-build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate applications.json from org repos
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const org = 'CDLI-NLSchools';
            const perPage = 100;
            let page = 1;
            let all = [];
            while (true) {
              const { data: repos } = await github.rest.repos.listForOrg({
                org,
                type: 'public',
                per_page: perPage,
                page
              });
              if (!repos || repos.length === 0) break;
              all = all.concat(repos);
              page++;
            }
            // Map repo fields into the applications.json shape. Adjust as needed.
            const apps = all.map(r => ({
              name: r.name,
              category: 'Repository',
              status: r.archived ? 'archived' : 'active',
              url: r.html_url,
              tags: r.topics || []
            }));
            fs.mkdirSync('public/data', { recursive: true });
            fs.writeFileSync('public/data/applications.json', JSON.stringify(apps, null, 2));
            console.log(`Wrote public/data/applications.json with ${apps.length} entries`);

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
