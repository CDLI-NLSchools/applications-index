name: daily-refresh
on:
  schedule:
    - cron: '0 6 * * *' # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

# Serialize runs: overlapping refreshes queue instead of racing each other to push.
concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  update-build-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate applications.json from org repos
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const org = 'cdli-nlschools';
            // Repos that are infrastructure, not student-facing applications
            const excluded = new Set(['applications-index', 'cdli-template-sim', 'course-template-demo', 'demo-repository']);
            // L1 course catalog from TAGGING.md: tag -> human-readable course name.
            // Drives the "Course" sort and the card category. Tags not in the
            // catalog are treated as unit/strand (L2) or non-curriculum tags.
            let courseNames = new Map();
            try {
              const tagging = fs.readFileSync('TAGGING.md', 'utf8');
              const catalog = tagging.split('## L1 course catalog')[1].split('## L2')[0];
              for (const m of catalog.matchAll(/^\|\s*(.+?)\s*\|\s*`([a-z0-9-]+)`\s*\|/gm)) {
                courseNames.set(m[2], m[1]);
              }
              console.log(`Loaded ${courseNames.size} course tags from TAGGING.md`);
            } catch (e) {
              console.log(`TAGGING.md unreadable, course data will be empty: ${e.message}`);
            }
            const repos = await github.paginate(github.rest.repos.listForOrg, { org, type: 'public', per_page: 100 });
            // Belt and braces: the API call above already asks for public repos only,
            // but explicitly drop anything private here so a private repo can never
            // leak into the public index, even if the API call is changed later.
            const live = repos.filter(r => !r.private && !r.archived && !excluded.has(r.name));
            const apps = [];
            for (const r of live) {
              // Top contributor = the application's creator in practice
              let creator = null;
              try {
                const { data } = await github.rest.repos.listContributors({ owner: org, repo: r.name, per_page: 1 });
                if (data && data.length > 0) {
                  creator = { login: data[0].login, avatar_url: data[0].avatar_url, url: data[0].html_url };
                }
              } catch (e) {
                console.log(`Could not list contributors for ${r.name}: ${e.message}`);
              }
              // Single-file download: only offered when index.html exists at the repo root
              let download_url = null;
              try {
                await github.rest.repos.getContent({ owner: org, repo: r.name, path: 'index.html' });
                download_url = `https://raw.githubusercontent.com/${org}/${r.name}/${r.default_branch}/index.html`;
              } catch (e) { /* no standalone file to download */ }
              const topics = r.topics || [];
              const courses = topics
                .filter(t => courseNames.has(t))
                .map(t => ({ tag: t, name: courseNames.get(t) }));
              apps.push({
                name: r.name,
                description: r.description || '',
                category: courses.length ? courses[0].name : 'Interactive',
                courses,
                status: 'active',
                url: `https://cdli-nlschools.github.io/${r.name}/`,
                repo: r.html_url,
                tags: topics,
                creator,
                created_at: r.created_at,
                updated_at: r.updated_at,
                download_url
              });
            }
            fs.mkdirSync('public/data', { recursive: true });
            fs.writeFileSync('public/data/applications.json', JSON.stringify(apps, null, 2));
            console.log(`Wrote public/data/applications.json with ${apps.length} entries`);

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Commit rebuilt site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily refresh: rebuild index $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin main
            git push
          fi
